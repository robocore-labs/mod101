# The mod101 bench stack ON REAL HARDWARE: the arm on its camera-tower
# harness, with the robocore agent in front of it.
#
#   cp docker/hardware.env.example docker/.env   # then edit MOD101_BUS
#   docker compose -f docker/hardware.compose.yaml up --build
#   docker compose -f docker/hardware.compose.yaml down
#
# The sim twin is docker/compose.yaml, and the shape is the same: one image
# built from this repo, one image pulled for the agent.
#
# WHY THIS EXISTS AT ALL, beyond parity with the sim. Running the stack from a
# host shell leaves orphans — a `kill` on the launch takes the launcher and
# misses its robot_state_publisher, which keeps publishing /robot_description
# and TF into the next run's graph. Three of those accumulated in one
# afternoon. `docker compose down` cannot leave one behind.

# BOTH COMPOSE FILES LIVE IN docker/, so without this they would both default
# to the project name "docker" — and `down` on one would report the other's
# containers as orphans and offer to remove them.
name: mod101-hw

x-ros: &ros
  # HOST NETWORKING + IPC, as in the sim stack: plain localhost DDS discovery,
  # and the agent's port 10101 reachable from this machine with no mapping.
  network_mode: host
  ipc: host
  # BOTH SERVICES RUN AS THE SAME UID. With ipc:host they share the host's
  # /dev/shm, which is also FastDDS's transport between them; mixed UIDs there
  # means participants discover each other and exchange no data.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # The serial device is usually root:dialout 0660. The container user is not
  # in that group unless it is added here, and the failure reads as "could not
  # open port" — indistinguishable from an unplugged robot.
  group_add: ["${DIALOUT_GID:-20}"]
  environment: &ros-env
    # A DIFFERENT DOMAIN FROM THE SIM, and this one is not cosmetic. The sim
    # stack runs on domain 1. Sharing a domain would put a simulated
    # controller_manager and a real one on the same graph: the sim's
    # arm_controller would publish onto the topics this arm's bridge is reading,
    # and a `ros2 topic pub` meant for the bench would reach the robot. Keep
    # them apart even though they are never meant to run together.
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-2}"
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    RCUTILS_COLORIZED_OUTPUT: "1"
    HOME: /home/ubuntu

services:

  # The robot: the description, ros2_control over the topic bridge, and the
  # Feetech bus driver.
  hardware:
    <<: *ros
    image: mod101-hw:jazzy
    build:
      context: ..                    # the repo root: the image needs src/
      dockerfile: docker/Dockerfile.hw
    # The servo bus. INSIDE the container it is always /dev/mod101-servo, which
    # is the name servos.yaml opens; on the host it is whatever MOD101_BUS says.
    # So a bench with docker/udev/99-mod101-servo.rules installed needs no .env
    # at all, and a bench without it sets MOD101_BUS=/dev/ttyACMn and still
    # runs — the container never sees the unstable name.
    devices:
      - ${MOD101_BUS:-/dev/mod101-servo}:/dev/mod101-servo
    command:
      - ros2
      - launch
      - mod101_hw_bringup
      - bringup.launch.py
      # Cameras run in their own service (below), not in the arm's launch: a
      # D435 that resets its USB link should not be able to interrupt the
      # process holding the servo bus.
      - cameras:=false
      # The pan/tilt: servos 7 and 8, calibrated +/- 90 deg each way.
      #
      # ON BY DEFAULT, AND THAT ASSUMES ONE CHAIN. servos.yaml declares a
      # single `port` for all eight motors, so the head has to be daisy-chained
      # onto the Link101 motor bus alongside the arm. Configuring the tower on
      # a separate USB adapter is fine — that is how it was calibrated — but
      # running it that way is not: with require_motors: true, servos 7 and 8
      # missing from the servo bus is a refusal to start that takes the
      # arm down with them. Two adapters means a SECOND servo_manager node with
      # its own port and joint_states_topic, not this flag.
      #
      # So: MOD101_HEAD=false whenever the tower is not on the arm's chain.
      - head:=${MOD101_HEAD:-true}
    # A robot holding its own weight should not be dropped by a supervisor
    # restart loop: if the driver refuses to start (motors silent, or a joint
    # resting outside its calibrated travel) that is a condition for a person
    # to resolve, not something to retry into.
    restart: "no"

  # The head RealSense D435, and the wrist camera when one is fitted.
  #
  # SEPARATE FROM THE ARM ON PURPOSE. This is the same image and the same
  # launch file the arm's bringup would have included, split out so the two
  # failure modes stay apart: a camera that drops off the USB bus restarts here
  # (restart: on-failure) while the arm, which must never be restarted
  # underneath its own weight, does not.
  #
  # PERMISSIONS ARE THE THING THAT BITES. librealsense opens the camera as raw
  # USB, and the nodes under /dev/bus/usb are root:root 0664 while this service
  # runs as the host UID. Install docker/udev/99-mod101-realsense.rules and
  # replug the camera, or the driver reports no device on a camera that lsusb
  # can see perfectly well.
  cameras:
    <<: *ros
    image: mod101-hw:jazzy
    # RAW USB, NOT A VIDEO NODE. The D435's colour and depth do not come from
    # /dev/video*: librealsense claims the USB device itself, so the whole
    # /dev/bus/usb tree has to be visible and the cgroup has to allow char
    # major 189 (usb) — and 81 (video4linux) for usb_cam and for the RealSense
    # metadata nodes. Mapping individual devices does not work here, because a
    # camera that re-enumerates comes back as a different bus/device number.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 81:* rmw'
    command:
      - ros2
      - launch
      - mod101_hw_bringup
      - cameras.launch.py
      - head_camera:=${MOD101_HEAD_CAMERA:-true}
      # No wrist camera on the harness yet. Left false because usb_cam against
      # an absent /dev/video0 is a node that starts, logs one error and sits
      # there — the failure is quiet enough to mistake for a working camera.
      - wrist_camera:=${MOD101_WRIST_CAMERA:-false}
      - wrist_camera_device:=${MOD101_WRIST_DEVICE:-/dev/video0}
      # The most expensive stream the D435 produces, and only deproject() needs
      # it. Off unless asked for.
      - pointcloud:=${MOD101_POINTCLOUD:-false}
    depends_on: [hardware]
    restart: on-failure:3
    privileged: true
    devices:
        - "/dev/*:/dev/*"

  # ROSBoard: a browser view of the graph on http://localhost:8888, and — in
  # the robocore fork — a Joint sliders card that COMMANDS THE ARM.
  #
  # THIS SERVICE CAN MOVE THE ROBOT. Its publish allowlist includes
  # std_msgs/Float64MultiArray, which is exactly what /arm_controller/commands
  # takes, and a JointGroupPositionController treats what it receives as a step:
  # every joint heads for its target at once, at servo speed, with no
  # trajectory and no collision checking. A slider dragged across its range is a
  # full-speed sweep of the arm.
  #
  # It binds 0.0.0.0:8888, and with network_mode: host there is no port mapping
  # to narrow that — so anything that can reach this machine on the LAN can
  # drive the arm. On a bench that is the convenience you want it for; on a
  # shared network it is worth knowing you have published robot control.
  #
  # The zero-on-silence watchdog deliberately does not cover position commands:
  # a "safe" zero for a Twist is a stop, but for a joint position it is a
  # command to travel to home. Closing the tab therefore holds the arm where it
  # is rather than moving it.
  rosboard:
    <<: *ros
    image: mod101-hw:jazzy
    command: [ros2, run, rosboard, rosboard_node]
    depends_on: [hardware]
    restart: "no"

  # The robocore agent: the JSON-RPC/WebSocket API in front of the robot, on
  # ws://localhost:10101. Robot specifics reach it only through the profile.
  agent:
    <<: *ros
    image: robocore-agent:latest
    volumes:
      - ../profiles/mod101_harness.yaml:/etc/robocore/profile.yaml:ro
      - agent-state:/var/lib/robocore
    # use_sim_time FALSE, and it is the one line that must differ from the sim
    # compose file. There is no /clock here, and a node waiting for simulated
    # time on a robot with no simulator never ticks — which looks exactly like
    # the hardware being dead.
    command:
      - agent
      - --profile
      - /etc/robocore/profile.yaml
      - --ros-args
      - -p
      - use_sim_time:=false
    depends_on: [hardware]
    restart: "no"

volumes:
  # The agent's audit log, saved maps and places.
  agent-state:

# CAMERA FRAMES AND TOPIC NAMES are the sim's, not the driver's:
# cameras.launch.py remaps the RealSense onto /harness/depth_camera/* so that
# profiles/mod101_harness.yaml reads the same on hardware as it does in Gazebo.
# If a topic you expect is missing, check the remappings there before the
# driver — the native realsense2_camera names are not what anything subscribes
# to in this stack.
