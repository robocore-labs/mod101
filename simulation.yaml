ros_distro: jazzy
ros_domain_id: 0
registry: localhost:5000
base_image_override: nvidia/cuda:12.6.1-base-ubuntu24.04   # 24.04 for jazzy
image_prefix: mod101-local

rmw_implementation: zenoh
zenoh:
  router_image: eclipse/zenoh:latest
  router_port: 7447


hosts:
  - name: localhost
    ip: 127.0.0.1
    user: cdr
    arch: amd64
    manager: true
    build_on_device: true
    mount_root: /home/cdr/robocore-deploy

components:

  - name: simulation
    gui: true
    nvidia: true
    volumes:
      - gz_fuel_cache:/root/.gz/fuel
    source:
      - src/mod101_description
      - src/mod101_control
      - src/mod101_gazebo
      - src/mod101_tool_parallel
      - src/mod101_tool_none
    runs_on: localhost
    entrypoint: ros2 launch mod101_gazebo gazebo.launch.py tool:=parallel

  - name: rosboard
    runs_on: localhost
    apt_packages: []
    ports:
      - "8888:8888"
    pip_packages:
      - tornado
      - simplejpeg
    repositories:
      - url: https://github.com/dheera/rosboard
        version: main
        folder: rosboard
    entrypoint: ros2 run rosboard rosboard_node

