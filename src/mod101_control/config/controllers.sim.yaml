controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on `100.0`)
    use_sim_time: true
    catch_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Simple position-command controller (active by default).
    # Send std_msgs/Float64MultiArray on /arm_controller/commands.
    arm_controller:
      type: forward_command_controller/ForwardCommandController

    # Trajectory controller for MoveIt (loaded inactive — switch via
    #   ros2 control switch_controllers \
    #     --activate arm_trajectory_controller --deactivate arm_controller
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: ["1", "2", "3", "4", "5"]
    interface_name: position

arm_trajectory_controller:
  ros__parameters:
    joints: ["1", "2", "3", "4", "5"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints: ["6"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
