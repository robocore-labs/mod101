controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on `100.0`)
    use_sim_time: true
    catch_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Active by default. position_controllers takes Float64MultiArray on
    # /<controller>/commands (same wire format as ForwardCommandController).
    arm_controller:
      type: position_controllers/JointGroupPositionController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

    # JTC retained for MoveIt — DO NOT spawn from the gazebo launch on this
    # Jazzy stack: gz_ros2_control + JTC currently segfaults in on_init
    # because gz_ros2_control predates the Resource Manager constructor
    # change (ros2_control issue #2400). Spawn from MoveIt's launch:
    #   ros2 run controller_manager spawner arm_trajectory_controller --inactive
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: ["1", "2", "3", "4", "5"]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

gripper_controller:
  ros__parameters:
    joints: ["6"]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

arm_trajectory_controller:
  ros__parameters:
    joints: ["1", "2", "3", "4", "5"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
