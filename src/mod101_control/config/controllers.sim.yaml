# Arm-only controllers. End-effector controllers live in
# mod101_tool_<tool>/config/controllers.yaml — gz_ros2_control loads both files.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on `100.0`)
    use_sim_time: true
    catch_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Active by default. position_controllers takes Float64MultiArray on
    # /<controller>/commands.
    arm_controller:
      type: position_controllers/JointGroupPositionController

    # What MoveIt drives (FollowJointTrajectory). Not spawned by the plain
    # gazebo launch, because it claims the same joints as arm_controller above
    # and controller_manager allows only one active claim per joint — use
    #   ros2 launch mod101_moveit_config demo.launch.py
    # which passes spawn_controllers:=false and brings this up instead.
    #
    # It used to segfault in on_init under gz_ros2_control (ros2_control issue
    # #2400); that is FIXED as of ros2_control 4.45.2 / gz_ros2_control 1.2.19,
    # verified by mod101_moveit_config/test/moveit_smoke.py.
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: ["joint_base", "joint_shoulder", "joint_elbow", "joint_wrist_tilt", "joint_wrist_roll"]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

arm_trajectory_controller:
  ros__parameters:
    joints: ["joint_base", "joint_shoulder", "joint_elbow", "joint_wrist_tilt", "joint_wrist_roll"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
