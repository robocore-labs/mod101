# Arm-only controllers. End-effector controllers live in
# mod101_tool_<tool>/config/controllers.yaml — gz_ros2_control loads both files.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must be int (Jazzy crashes on `100.0`)
    use_sim_time: true
    catch_exceptions: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Active by default. position_controllers takes Float64MultiArray on
    # /<controller>/commands.
    arm_controller:
      type: position_controllers/JointGroupPositionController

    # JTC retained for MoveIt — not spawned from the gazebo launch (segfaults
    # in on_init on Jazzy; ros2_control issue #2400). Spawn from MoveIt's
    # launch when needed:
    #   ros2 run controller_manager spawner arm_trajectory_controller --inactive
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: ["joint_base", "joint_shoulder", "joint_elbow", "joint_wrist_tilt"]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true

arm_trajectory_controller:
  ros__parameters:
    joints: ["joint_base", "joint_shoulder", "joint_elbow", "joint_wrist_tilt"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
