# The ONLY control config this overlay adds: the harness pan/tilt head.
#
# gz_ros2_control (and a hardware controller_manager) merges this with
# mod101_control/config/controllers.sim.yaml, which already sets update_rate /
# use_sim_time and declares joint_state_broadcaster + the arm controllers for
# the (unprefixed) arm. Nothing here is redeclared.
controller_manager:
  ros__parameters:
    pan_tilt_controller:
      type: position_controllers/JointGroupPositionController

pan_tilt_controller:
  ros__parameters:
    joints: [hn_pan_joint, hn_tilt_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    open_loop_control: true
