# Controllers contributed by the PincOpen tool. Loaded by gz_ros2_control
# alongside the arm's controllers.sim.yaml — both share the model's single
# controller_manager namespace. Named `gripper_controller` for topic-parity
# with mod101_tool_parallel, so downstream code (`/gripper_controller/commands`)
# is tool-agnostic.
#
# Range note: PincOpen's `6` joint is revolute, lower=-2.44 rad (open),
# upper=0.0 rad (closed). Sign is OPPOSITE to mod101_tool_parallel's prismatic
# `6` (positive = open). MoveIt configs that talked to the parallel tool need
# their gripper goal flipped.
controller_manager:
  ros__parameters:
    gripper_controller:
      type: position_controllers/JointGroupPositionController

    # MoveIt drives grippers over FollowJointTrajectory, not Float64MultiArray.
    # Same arrangement as the arm's arm_controller / arm_trajectory_controller
    # pair: both claim joint 6, so only one may be active at a time —
    # mod101_moveit_config's launch deactivates gripper_controller when it
    # spawns this one.
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gripper_trajectory_controller:
  ros__parameters:
    joints: ["6"]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints: ["6"]
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true
